name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -q
      - uses: actions/upload-artifact@v4
        with:
          name: freshtracks-jar
          path: build/libs/freshtracks-*.jar
